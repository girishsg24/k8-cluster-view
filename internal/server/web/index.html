<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClusterView</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>ClusterView</h1>
  <section id="summary" class="summary">Loading summary…</section>
  <div class="cols">
    <section>
      <h2>Nodes</h2>
      <table id="nodes"><thead><tr>
        <th>Name</th><th>Ready</th><th>Roles</th>
        <th>CPU (alloc/cap)</th><th>Mem (alloc/cap)</th><th>Pods</th>
      </tr></thead><tbody></tbody></table>
    </section>
    <section>
      <h2 id="pods-title">Pods – click a node</h2>
      <table id="pods"><thead><tr>
        <th>Namespace</th><th>Name</th><th>Phase</th><th>Restarts</th>
      </tr></thead><tbody></tbody></table>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
