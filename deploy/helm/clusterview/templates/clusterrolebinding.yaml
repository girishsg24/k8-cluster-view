apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clusterview.name" . }}
  labels:
    {{- include "clusterview.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusterview-role
subjects:
- kind: ServiceAccount
  name: {{ include "clusterview.name" . }}
  namespace: {{ .Release.Namespace }}
