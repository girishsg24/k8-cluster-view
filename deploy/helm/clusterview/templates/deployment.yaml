apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clusterview.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clusterview.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: clusterview
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "clusterview.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clusterview.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --api-addr=:{{ .Values.service.port }}
        - --clusterview-name={{ .Values.clusterView.name }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
        livenessProbe:
          httpGet: { path: /healthz, port: http }
        readinessProbe:
          httpGet: { path: /readyz, port: http }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
